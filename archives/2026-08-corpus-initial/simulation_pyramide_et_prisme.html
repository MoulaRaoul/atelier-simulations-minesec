<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation 3D : Pyramide et Prisme</title>
    
    <!-- Intégration de Tailwind CSS pour le style de l'interface -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Intégration de Three.js pour la 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Intégration de OrbitControls pour la navigation à la souris -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden; /* Empêche le défilement */
            background-color: #0f172a; /* Fond sombre élégant */
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Style personnalisé pour les contrôles UI par dessus la 3D */
        #ui-panel {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
        }
        
        /* Loader d'instructions au démarrage */
        #instructions {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="instructions" class="text-sm shadow-lg">
        Cliquez et glissez pour tourner • Molette pour zoomer
    </div>

    <!-- Panneau de contrôle -->
    <div id="ui-panel" class="rounded-2xl p-4 shadow-2xl border border-slate-600 flex gap-4 items-center">
        <h1 class="text-white font-bold text-lg mr-4 border-r border-slate-600 pr-4">Contrôles 3D</h1>
        
        <button id="btn-rotate" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md">
            ⏸ Pause Rotation
        </button>
        
        <button id="btn-wireframe" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md">
            🌐 Mode Fil de fer
        </button>
        
        <button id="btn-reset" class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md">
            🔄 Réinitialiser
        </button>
    </div>

    <!-- Conteneur pour le rendu Three.js -->
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let pyramide, prisme;
        let isRotating = true;
        let isWireframe = false;

        // Disparition des instructions après 4 secondes
        setTimeout(() => {
            document.getElementById('instructions').style.opacity = '0';
        }, 4000);

        function init() {
            // 1. Création de la scène
            scene = new THREE.Scene();
            // Ajout d'un léger brouillard pour la profondeur
            scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

            // 2. Création de la caméra (Champ de vision, Ratio, Plan proche, Plan lointain)
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 8, 25);

            // 3. Création du moteur de rendu (Renderer)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Ombres activées
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Lumières
            // Lumière d'ambiance
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // Lumière directionnelle principale (Soleil)
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Lumière d'appoint (bleutée pour contraster)
            const fillLight = new THREE.PointLight(0x4a90e2, 0.5, 50);
            fillLight.position.set(-10, 5, -10);
            scene.add(fillLight);

            // Ajout d'une grille au sol pour se repérer dans l'espace
            const gridHelper = new THREE.GridHelper(40, 40, 0x475569, 0x1e293b);
            scene.add(gridHelper);

            // Sol invisible pour recevoir les ombres
            const planeGeo = new THREE.PlaneGeometry(40, 40);
            const planeMat = new THREE.ShadowMaterial({ opacity: 0.5 });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);

            // 5. Création des objets
            
            // Matériaux communs (Standard pour réagir à la lumière)
            const materialParams = { 
                roughness: 0.2, 
                metalness: 0.1,
                transparent: true,
                opacity: 0.9
            };

            // --- LA PYRAMIDE (Base carrée) ---
            // Une pyramide est un cône avec 4 segments radiaux
            const radiusPyramid = 4;
            const heightPyramid = 8;
            const radialSegments = 4;
            const pyramideGeo = new THREE.ConeGeometry(radiusPyramid, heightPyramid, radialSegments);
            
            const pyramideMat = new THREE.MeshStandardMaterial({ 
                color: 0xef4444, // Rouge (Tailwind red-500)
                ...materialParams 
            });
            
            pyramide = new THREE.Mesh(pyramideGeo, pyramideMat);
            pyramide.position.set(-6, heightPyramid / 2, 0); // Positionnée à gauche
            // Rotation pour aligner les faces au lieu des arêtes avec les axes
            pyramide.rotation.y = Math.PI / 4; 
            pyramide.castShadow = true;
            pyramide.receiveShadow = true;
            
            // Ajout des arêtes visibles (Wireframe helper)
            const pyEdges = new THREE.EdgesGeometry(pyramideGeo);
            const pyLine = new THREE.LineSegments(pyEdges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
            pyramide.add(pyLine); // L'arête devient un enfant de la pyramide
            
            scene.add(pyramide);

            // --- LE PRISME (Base triangulaire) ---
            // Un prisme triangulaire régulier est un cylindre avec 3 segments
            const radiusPrisme = 4;
            const heightPrisme = 8;
            const prismeGeo = new THREE.CylinderGeometry(radiusPrisme, radiusPrisme, heightPrisme, 3);
            
            const prismeMat = new THREE.MeshStandardMaterial({ 
                color: 0x10b981, // Vert (Tailwind emerald-500)
                ...materialParams 
            });
            
            prisme = new THREE.Mesh(prismeGeo, prismeMat);
            prisme.position.set(6, heightPrisme / 2, 0); // Positionné à droite
            // On oriente la pointe du triangle vers l'avant
            prisme.rotation.y = -Math.PI / 6;
            prisme.castShadow = true;
            prisme.receiveShadow = true;

            // Ajout des arêtes visibles
            const prEdges = new THREE.EdgesGeometry(prismeGeo);
            const prLine = new THREE.LineSegments(prEdges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
            prisme.add(prLine);

            scene.add(prisme);

            // 6. Contrôles de la caméra (Orbital)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Rendu plus fluide
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // Empêche de trop descendre sous le sol
            controls.minDistance = 10;
            controls.maxDistance = 50;

            // 7. Écouteurs d'événements (UI & Fenêtre)
            window.addEventListener('resize', onWindowResize, false);
            setupUI();
        }

        function setupUI() {
            const btnRotate = document.getElementById('btn-rotate');
            const btnWireframe = document.getElementById('btn-wireframe');
            const btnReset = document.getElementById('btn-reset');

            btnRotate.addEventListener('click', () => {
                isRotating = !isRotating;
                btnRotate.textContent = isRotating ? "⏸ Pause Rotation" : "▶️ Reprendre Rotation";
                btnRotate.className = isRotating 
                    ? "bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md" 
                    : "bg-amber-500 hover:bg-amber-400 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md";
            });

            btnWireframe.addEventListener('click', () => {
                isWireframe = !isWireframe;
                // Met à jour les matériaux de la pyramide et du prisme
                pyramide.material.wireframe = isWireframe;
                prisme.material.wireframe = isWireframe;
                
                btnWireframe.className = isWireframe
                    ? "bg-purple-800 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md"
                    : "bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg transition-colors font-medium shadow-md";
            });

            btnReset.addEventListener('click', () => {
                // Réinitialiser la caméra
                camera.position.set(0, 8, 25);
                controls.target.set(0, 0, 0);
                
                // Réinitialiser la rotation des objets
                pyramide.rotation.set(0, Math.PI / 4, 0);
                prisme.rotation.set(0, -Math.PI / 6, 0);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotation automatique si activée
            if (isRotating) {
                pyramide.rotation.y += 0.005;
                prisme.rotation.y -= 0.005; // Tourne dans le sens inverse
            }

            // Mise à jour des contrôles (nécessaire pour l'amortissement/damping)
            controls.update();

            // Rendu de la scène
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
