<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendu 3D Low-Poly Stylisé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #F6F8FB 0%, #DCE4EE 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #0F1B2D;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(246, 248, 251, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            color: #0F1B2D;
            font-size: 13px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid rgba(15, 27, 45, 0.12);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            z-index: 10;
        }
        .toggle-btn {
            background: #DCE4EE;
            border: none;
            color: #0F1B2D;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .toggle-btn:hover {
            background: #C9D4E1;
        }
        .toggle-btn.active {
            background: #0B6C76;
            color: #F6F8FB;
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
        }

        #control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 320px;
            max-height: calc(100vh - 30px);
            background: rgba(246, 248, 251, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(15, 27, 45, 0.12);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            padding: 16px;
            overflow-y: auto;
            z-index: 20;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #control-panel.collapsed {
            transform: translateX(340px);
            opacity: 0;
            pointer-events: none;
        }
        #panel-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 30;
            background: rgba(246, 248, 251, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(15, 27, 45, 0.15);
            color: #0F1B2D;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .panel-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffca3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-section {
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a99ad;
            margin-bottom: 10px;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .control-row label {
            flex: 1;
            color: #ccc;
        }
        .control-row input[type="range"] {
            flex: 1.2;
            height: 4px;
            accent-color: #ffaa00;
            cursor: pointer;
        }
        .control-row input[type="color"] {
            border: none;
            width: 28px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }
        .val-badge {
            width: 36px;
            text-align: right;
            font-family: monospace;
            color: #ffda79;
            font-size: 11px;
        }

        #poly-breakdown {
            font-size: 11px;
            line-height: 1.5;
            color: #aaa;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }
        #poly-breakdown div {
            display: flex;
            justify-content: space-between;
        }
        #poly-breakdown strong {
            color: #4cc9f0;
        }
    </style>
    <!-- Three.js r128 depuis cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <button id="panel-toggle-btn">⚙️ Réglages</button>

    <div id="control-panel">
        <div class="panel-header">
            <span>Studio Control</span>
        </div>

        <!-- Section Ampoule -->
        <div class="control-section">
            <div class="section-title">💡 Ampoule (PointLight)</div>
            <div class="control-row">
                <label>Interrupteur</label>
                <button class="toggle-btn active" id="btn-light-switch" style="font-size:11px; padding:3px 10px;">ON</button>
            </div>
            <div class="control-row">
                <label>Intensité</label>
                <input type="range" id="bulb-intensity" min="0" max="6" step="0.1" value="2.5">
                <span class="val-badge" id="val-bulb-intensity">2.5</span>
            </div>
            <div class="control-row">
                <label>Portée (cm)</label>
                <input type="range" id="bulb-range" min="100" max="1500" step="10" value="500">
                <span class="val-badge" id="val-bulb-range">500</span>
            </div>
            <div class="control-row">
                <label>Couleur</label>
                <input type="color" id="bulb-color" value="#ffa000">
            </div>
        </div>

        <!-- Section Lumière Principale -->
        <div class="control-section">
            <div class="section-title">☀️ Lumière Principale (Soleil)</div>
            <div class="control-row">
                <label>Intensité</label>
                <input type="range" id="main-intensity" min="0" max="3" step="0.1" value="0.9">
                <span class="val-badge" id="val-main-intensity">0.9</span>
            </div>
            <div class="control-row">
                <label>Couleur</label>
                <input type="color" id="main-color" value="#fff0dd">
            </div>
            <div class="control-row">
                <label>Position X (cm)</label>
                <input type="range" id="main-pos-x" min="-1000" max="1000" step="10" value="500">
                <span class="val-badge" id="val-main-pos-x">500</span>
            </div>
            <div class="control-row">
                <label>Position Y (cm)</label>
                <input type="range" id="main-pos-y" min="100" max="1500" step="10" value="800">
                <span class="val-badge" id="val-main-pos-y">800</span>
            </div>
            <div class="control-row">
                <label>Position Z (cm)</label>
                <input type="range" id="main-pos-z" min="-1000" max="1000" step="10" value="400">
                <span class="val-badge" id="val-main-pos-z">400</span>
            </div>
        </div>

        <!-- Section Lumière Appoint & Ambiante -->
        <div class="control-section">
            <div class="section-title">🌤️ Appoint & Ambiance</div>
            <div class="control-row">
                <label>Intensité Appoint</label>
                <input type="range" id="fill-intensity" min="0" max="2" step="0.05" value="0.4">
                <span class="val-badge" id="val-fill-intensity">0.40</span>
            </div>
            <div class="control-row">
                <label>Couleur Appoint</label>
                <input type="color" id="fill-color" value="#7090c0">
            </div>
            <div class="control-row">
                <label>Intensité Ambiante</label>
                <input type="range" id="ambient-intensity" min="0" max="2" step="0.05" value="0.6">
                <span class="val-badge" id="val-ambient-intensity">0.60</span>
            </div>
        </div>

        <!-- Section Caméra -->
        <div class="control-section">
            <div class="section-title">📷 Caméra</div>
            <div class="control-row">
                <label>Champ de vision (FOV)</label>
                <input type="range" id="cam-fov" min="20" max="80" step="1" value="38">
                <span class="val-badge" id="val-cam-fov">38°</span>
            </div>
            <div class="control-row">
                <label>Distance (cm)</label>
                <input type="range" id="cam-dist" min="100" max="1500" step="10" value="180">
                <span class="val-badge" id="val-cam-dist">180</span>
            </div>
        </div>

        <!-- Breakdown polygones -->
        <div class="section-title" style="margin-top:12px;">📊 Bilan Géométrique</div>
        <div id="poly-breakdown">Chargement des stats...</div>
    </div>

    <!-- UI Basse -->
    <div id="ui-overlay">
        <span>Glisser pour tourner | Molette pour zoomer</span>
        <button class="toggle-btn" id="toggle-shadows">Ombres : OFF</button>
        <button class="toggle-btn" id="toggle-ruler">Règle : OFF</button>
    </div>

    <script>
        const CONFIG = {
            ombres: false,
            facettes: false   // true = retrouver le rendu facetté « bas-poly »
        };

        // ---------------------------------------------------------------------
        // OBJET STYLE INDÉPENDANT
        // ---------------------------------------------------------------------
        const Style = {
            palettes: {
                // Registre « lisse minimal » : tons sourds, mats avec un soupçon de satin, un seul accent
                bois:      { color: 0xC8B79A, roughness: 0.70, metalness: 0.00 },
                terrecuite:{ color: 0xB98B74, roughness: 0.75, metalness: 0.00 },
                verre:     { color: 0xF0F4F8, roughness: 0.05, metalness: 0.00, opacity: 0.22, transparent: true, flatShading: false },
                metal:     { color: 0xB8BEC6, roughness: 0.45, metalness: 0.60 },
                eau:       { color: 0x0B6C76, roughness: 0.15, metalness: 0.00, opacity: 0.70, transparent: true, flatShading: false },
                vegetal:   { color: 0x7C8F6E, roughness: 0.70, metalness: 0.00 },
                laiton:    { color: 0xC9B27A, roughness: 0.50, metalness: 0.50 },
                plastique: { color: 0x4A5B73, roughness: 0.60, metalness: 0.00 },
                filament:  { color: 0xFFE3A3, emissive: 0xFFB703, emissiveIntensity: 1.5, roughness: 0.10, flatShading: false }
            },

            styleMatiere: function(mesh, famille) {
                const config = this.palettes[famille] || this.palettes.bois;
                const mat = new THREE.MeshStandardMaterial({
                    color: config.color,
                    roughness: config.roughness,
                    metalness: config.metalness,
                    flatShading: CONFIG.facettes && config.flatShading !== false,
                    transparent: config.transparent || false,
                    opacity: config.opacity !== undefined ? config.opacity : 1.0,
                    side: config.transparent ? THREE.DoubleSide : THREE.FrontSide
                });

                if (config.emissive) {
                    mat.emissive = new THREE.Color(config.emissive);
                    mat.emissiveIntensity = config.emissiveIntensity || 1.0;
                }

                mesh.material = mat;
                mesh.castShadow = CONFIG.ombres;
                mesh.receiveShadow = CONFIG.ombres;
                return mesh;
            },

            ombreContact: function(radius = 1, opacity = 0.4) {
                const group = new THREE.Group();
                group.name = "ombreContact";
                const rings = 5;
                for (let i = rings; i > 0; i--) {
                    const r = radius * (i / rings);
                    const alpha = opacity * 0.6 * Math.pow(1 - (i / rings), 1.5);
                    const geo = new THREE.RingGeometry(0, r, 24);
                    const mat = new THREE.MeshBasicMaterial({
                        color: 0x2B3442,
                        transparent: true,
                        opacity: alpha,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                        polygonOffset: true,
                        polygonOffsetFactor: -1,
                        polygonOffsetUnits: -1
                    });
                    const ringMesh = new THREE.Mesh(geo, mat);
                    ringMesh.rotation.x = -Math.PI / 2;
                    group.add(ringMesh);
                }
                return group;
            },

            preparerScene: function(scene) {
                // Fond : dégradé CSS clair vu à travers un rendu transparent (cyclorama)
                scene.background = null;
                // Brouillard très léger, couleur du bas du dégradé : le sol se fond sans horizon
                scene.fog = new THREE.Fog(0xDCE4EE, 500, 1400);

                // Ambiance d'hémisphère : ciel blanc, sol clair
                const ambientLight = new THREE.HemisphereLight(0xFFFFFF, 0xDCE4EE, 0.55);
                scene.add(ambientLight);
                this.ambientLight = ambientLight;

                // Lumière principale large et douce, légèrement chaude
                const mainLight = new THREE.DirectionalLight(0xFFF4E6, 1.0);
                mainLight.position.set(400, 700, 300);
                scene.add(mainLight);
                this.mainLight = mainLight;

                // Lumière d'appoint large et fraîche
                const fillLight = new THREE.DirectionalLight(0xDFE8F5, 0.5);
                fillLight.position.set(-500, 300, -200);
                scene.add(fillLight);
                this.fillLight = fillLight;

                // Contre-jour discret : détache les objets du fond
                const rimLight = new THREE.DirectionalLight(0xFFFFFF, 0.35);
                rimLight.position.set(-200, 400, -700);
                scene.add(rimLight);
                this.rimLight = rimLight;

                const floorGeo = new THREE.PlaneGeometry(3000, 3000, 1, 1);
                const floorMat = new THREE.MeshStandardMaterial({
                    color: 0xE3E9F1,
                    roughness: 1.0,
                    metalness: 0.0
                });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -70;
                floor.receiveShadow = CONFIG.ombres;
                scene.add(floor);
            },

            setOmbresActive: function(scene, active) {
                CONFIG.ombres = active;
                if (this.mainLight) {
                    this.mainLight.castShadow = active;
                }
                scene.traverse((child) => {
                    if (child.isMesh && child.name !== "ombreContact") {
                        child.castShadow = active;
                        child.receiveShadow = active;
                    }
                });
            }
        };

        // ---------------------------------------------------------------------
        // CRÉATION DES OBJETS RECONFIGURÉS (ÉCHELLE 1 UNITÉ = 1 CM)
        // ---------------------------------------------------------------------

        function creerTable() {
            const L = 120, l = 60, H = 70;
            const epaisseur = 2.5;

            const tableGroup = new THREE.Group();
            tableGroup.name = "Table";

            const plateauGeo = new THREE.BoxGeometry(L, epaisseur, l);
            const plateau = new THREE.Mesh(plateauGeo);
            Style.styleMatiere(plateau, 'bois');
            plateau.position.y = -epaisseur / 2;
            tableGroup.add(plateau);

            const hPied = H - epaisseur + 0.2; 
            const piedGeo = new THREE.BoxGeometry(4, hPied, 4); 
            const positions = [
                [-L/2 + 6, l/2 - 6], [L/2 - 6, l/2 - 6], 
                [L/2 - 6, -l/2 + 6], [-L/2 + 6, -l/2 + 6]
            ];
            
            positions.forEach(p => {
                const pied = new THREE.Mesh(piedGeo);
                Style.styleMatiere(pied, 'metal');
                pied.position.set(p[0], -H + (hPied / 2), p[1]); 
                tableGroup.add(pied);
                
                const ombrePied = Style.ombreContact(10, 0.6);
                ombrePied.position.set(p[0], -H, p[1]);
                tableGroup.add(ombrePied);
            });

            const ombreSol = Style.ombreContact(70, 0.3);
            ombreSol.scale.set(1.5, 1, 0.8);
            ombreSol.position.y = -H;
            tableGroup.add(ombreSol);

            return tableGroup;
        }

        function creerCalebasse() {
            const hauteur = 30, dPanse = 25, dCol = 8, dOuverture = 5;
            
            const group = new THREE.Group();
            group.name = "Calebasse";

            const points = [];
            points.push(new THREE.Vector2(0, 0));
            points.push(new THREE.Vector2(5, 0.5));
            points.push(new THREE.Vector2(dPanse / 2, 10));
            points.push(new THREE.Vector2(9, 18));
            points.push(new THREE.Vector2(3.5, 24));
            points.push(new THREE.Vector2(dCol / 2, 28));
            points.push(new THREE.Vector2(dOuverture / 2, hauteur));
            
            const calebasseGeo = new THREE.LatheGeometry(points, 48);
            const corps = new THREE.Mesh(calebasseGeo);
            Style.styleMatiere(corps, 'terrecuite');
            group.add(corps);

            const cordeGeo = new THREE.TorusGeometry(4.2, 0.3, 12, 48);
            const corde = new THREE.Mesh(cordeGeo);
            corde.rotation.x = Math.PI / 2;
            Style.styleMatiere(corde, 'bois');
            corde.position.y = 24;
            group.add(corde);

            const ombre = Style.ombreContact(18, 0.45);
            group.add(ombre);

            return group;
        }

        function creerVerreAvecEau() {
            const hauteur = 11, diametre = 7;
            const rExt = diametre / 2;
            
            const group = new THREE.Group();
            group.name = "Verre";

            const verreGeo = new THREE.CylinderGeometry(rExt, rExt * 0.8, hauteur, 48, 1, true);
            const verre = new THREE.Mesh(verreGeo);
            Style.styleMatiere(verre, 'verre');
            verre.position.y = hauteur / 2;
            group.add(verre);

            const fondGeo = new THREE.CylinderGeometry(rExt * 0.8, rExt * 0.75, 1.5, 48);
            const fond = new THREE.Mesh(fondGeo);
            Style.styleMatiere(fond, 'verre');
            fond.position.y = 0.75;
            group.add(fond);

            const eauGeo = new THREE.CylinderGeometry(rExt * 0.94, rExt * 0.78, 7.5, 48);
            const eau = new THREE.Mesh(eauGeo);
            Style.styleMatiere(eau, 'eau');
            eau.position.y = 5.25;
            group.add(eau);

            const surfaceGeo = new THREE.CircleGeometry(rExt * 0.94, 10);
            const surface = new THREE.Mesh(surfaceGeo);
            surface.rotation.x = -Math.PI / 2;
            Style.styleMatiere(surface, 'eau');
            surface.position.y = 9.05;
            group.add(surface);

            const ombre = Style.ombreContact(10, 0.35);
            group.add(ombre);

            return group;
        }

        let bulbPointLight, bulbHaloSprite, bulbFilamentMesh;

        function genererHaloTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,220,120,1)');
            gradient.addColorStop(0.4, 'rgba(255,160,0,0.4)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function creerAmpoule() {
            const dGlobe = 6, dCulot = 2.7;
            const rGlobe = dGlobe / 2;
            const rCulot = dCulot / 2;

            const group = new THREE.Group();
            group.name = "Ampoule";

            const globeGeo = new THREE.IcosahedronGeometry(rGlobe, 4);
            const globe = new THREE.Mesh(globeGeo);
            Style.styleMatiere(globe, 'verre');
            globe.position.y = 8;
            group.add(globe);

            const colGeo = new THREE.CylinderGeometry(rCulot, rCulot + 0.3, 2.5, 32, 1, true);
            const col = new THREE.Mesh(colGeo);
            Style.styleMatiere(col, 'metal');
            col.position.y = 3.75;
            group.add(col);

            const douilleGeo = new THREE.CylinderGeometry(rCulot, rCulot, 2.5, 32);
            const douille = new THREE.Mesh(douilleGeo);
            Style.styleMatiere(douille, 'laiton');
            douille.position.y = 1.45; 
            group.add(douille);

            const contactGeo = new THREE.CylinderGeometry(0.5, 0.2, 0.6, 16);
            const contact = new THREE.Mesh(contactGeo);
            Style.styleMatiere(contact, 'metal');
            contact.position.y = 0.1;
            group.add(contact);

            const filamentGeo = new THREE.TorusGeometry(0.7, 0.1, 8, 32);
            bulbFilamentMesh = new THREE.Mesh(filamentGeo);
            bulbFilamentMesh.rotation.x = Math.PI / 2;
            Style.styleMatiere(bulbFilamentMesh, 'filament');
            bulbFilamentMesh.position.y = 8;
            group.add(bulbFilamentMesh);

            // PointLight de l'ampoule augmentée pour être la source principale et dominante
            bulbPointLight = new THREE.PointLight(0xffa000, 5.5, 800, 1.5);
            bulbPointLight.position.set(0, 8, 0);
            group.add(bulbPointLight);

            const haloMat = new THREE.SpriteMaterial({
                map: genererHaloTexture(),
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            bulbHaloSprite = new THREE.Sprite(haloMat);
            bulbHaloSprite.scale.set(15, 15, 1.0);
            bulbHaloSprite.position.set(0, 8, 0);
            group.add(bulbHaloSprite);

            const ombre = Style.ombreContact(6, 0.4);
            group.add(ombre);

            return group;
        }

        function creerPile() {
            const H = 6, d = 3.4;
            const R = d / 2;

            const group = new THREE.Group();
            group.name = "Pile Type D";

            const corpsGeo = new THREE.CylinderGeometry(R, R, H - 0.8, 32);
            const corps = new THREE.Mesh(corpsGeo);
            Style.styleMatiere(corps, 'plastique');
            corps.position.y = (H - 0.8) / 2;
            group.add(corps);

            const hautGeo = new THREE.CylinderGeometry(R * 1.02, R * 1.02, 1.0, 32);
            const haut = new THREE.Mesh(hautGeo);
            Style.styleMatiere(haut, 'metal');
            haut.position.y = H - 0.7;
            group.add(haut);

            const plotGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const plot = new THREE.Mesh(plotGeo);
            Style.styleMatiere(plot, 'metal');
            plot.position.y = H - 0.1;
            group.add(plot);

            const ombre = Style.ombreContact(R + 0.5, 0.4);
            group.add(ombre);

            return group;
        }

        function creerRegle() {
            const group = new THREE.Group();
            group.name = "Règle Graduée (30cm)";

            const regleGeo = new THREE.BoxGeometry(30, 0.2, 3);
            const regle = new THREE.Mesh(regleGeo);
            Style.styleMatiere(regle, 'plastique');
            regle.material.color.setHex(0xffda79);
            regle.position.y = 0.1;
            group.add(regle);

            for (let i = 0; i <= 30; i++) {
                const isTen = i % 10 === 0;
                const isFive = i % 5 === 0 && !isTen;
                const markL = isTen ? 1.5 : (isFive ? 1.0 : 0.5);
                
                const geo = new THREE.PlaneGeometry(0.1, markL);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: 0x111111, 
                    polygonOffset: true, polygonOffsetFactor: -2 
                });
                const mark = new THREE.Mesh(geo, mat);
                mark.rotation.x = -Math.PI / 2;
                mark.position.set(i - 15, 0.21, 1.5 - markL / 2);
                group.add(mark);
            }

            const ombre = Style.ombreContact(16, 0.2);
            ombre.scale.set(1.0, 1, 0.15);
            group.add(ombre);
            
            group.visible = false;
            return group;
        }

        // ---------------------------------------------------------------------
        // INITIALISATION ET LOGIQUE DE LA SCÈNE
        // ---------------------------------------------------------------------

        let scene, camera, renderer, regleMesh;
        let isBulbOn = true;
        let savedBulbIntensity = 5.5;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 1, 10000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            Style.preparerScene(scene);

            // Ajout des objets
            const table = creerTable();
            scene.add(table);

            const calebasse = creerCalebasse();
            calebasse.position.set(-30, 0, 5);
            calebasse.rotation.y = 0.4;
            scene.add(calebasse);

            const verre = creerVerreAvecEau();
            verre.position.set(35, 0, 15);
            scene.add(verre);

            const ampoule = creerAmpoule();
            ampoule.position.set(15, 0, -15);
            ampoule.rotation.y = -0.5;
            scene.add(ampoule);

            const pile = creerPile();
            pile.position.set(45, 0, -5);
            pile.rotation.y = 0.8;
            scene.add(pile);

            const pileCouchee = creerPile();
            pileCouchee.name = "Pile Type D (Couchée)";
            pileCouchee.position.set(-10, 1.7, 20);
            pileCouchee.rotation.z = Math.PI / 2;
            pileCouchee.rotation.y = 0.6;
            scene.add(pileCouchee);
            // Initialisation des curseurs dans le panneau de contrôle selon les nouvelles valeurs par défaut
            document.getElementById('main-intensity').value = 0.3;
            document.getElementById('val-main-intensity').innerText = '0.3';
            document.getElementById('bulb-intensity').value = 5.5;
            document.getElementById('val-bulb-intensity').innerText = '5.5';

            setupOrbitControls();
            setupControlPanel();
            compterPolygones();

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        // ---------------------------------------------------------------------
        // CÂBLAGE DU PANNEAU DE RÉGLAGE ET INTERACTIONS
        // ---------------------------------------------------------------------
        function setupControlPanel() {
            const panel = document.getElementById('control-panel');
            const panelBtn = document.getElementById('panel-toggle-btn');
            
            panelBtn.addEventListener('click', () => {
                panel.classList.toggle('collapsed');
            });

            const switchBtn = document.getElementById('btn-light-switch');
            switchBtn.addEventListener('click', () => {
                isBulbOn = !isBulbOn;
                switchBtn.classList.toggle('active', isBulbOn);
                switchBtn.innerText = isBulbOn ? 'ON' : 'OFF';
                updateBulbState();
            });

            bindSlider('bulb-intensity', (val) => {
                savedBulbIntensity = val;
                if (isBulbOn) bulbPointLight.intensity = val;
                bulbHaloSprite.scale.set(0.8 + val * 0.25, 0.8 + val * 0.25, 1.0);
            });
            bindSlider('bulb-range', (val) => { bulbPointLight.distance = val; });
            document.getElementById('bulb-color').addEventListener('input', (e) => {
                const col = new THREE.Color(e.target.value);
                bulbPointLight.color = col;
                if (bulbFilamentMesh) bulbFilamentMesh.material.emissive = col;
            });

            bindSlider('main-intensity', (val) => { Style.mainLight.intensity = val; });
            document.getElementById('main-color').addEventListener('input', (e) => {
                Style.mainLight.color.set(e.target.value);
            });
            bindSlider('main-pos-x', (val) => { Style.mainLight.position.x = val; });
            bindSlider('main-pos-y', (val) => { Style.mainLight.position.y = val; });
            bindSlider('main-pos-z', (val) => { Style.mainLight.position.z = val; });

            bindSlider('fill-intensity', (val) => { Style.fillLight.intensity = val; });
            document.getElementById('fill-color').addEventListener('input', (e) => {
                Style.fillLight.color.set(e.target.value);
            });
            bindSlider('ambient-intensity', (val) => { Style.ambientLight.intensity = val; });

            bindSlider('cam-fov', (val) => {
                camera.fov = val;
                camera.updateProjectionMatrix();
            }, '°');
            bindSlider('cam-dist', (val) => {
                cameraDistance = val;
                updateCameraPosition();
            });

            document.getElementById('toggle-shadows').addEventListener('click', (e) => {
                CONFIG.ombres = !CONFIG.ombres;
                renderer.shadowMap.enabled = CONFIG.ombres;
                Style.setOmbresActive(scene, CONFIG.ombres);
                e.target.innerText = `Ombres : ${CONFIG.ombres ? 'ON' : 'OFF'}`;
                e.target.classList.toggle('active', CONFIG.ombres);
            });

            document.getElementById('toggle-ruler').addEventListener('click', (e) => {
                regleMesh.visible = !regleMesh.visible;
                e.target.innerText = `Règle : ${regleMesh.visible ? 'ON' : 'OFF'}`;
                e.target.classList.toggle('active', regleMesh.visible);
            });
        }

        function bindSlider(id, callback, unit = '') {
            const input = document.getElementById(id);
            const badge = document.getElementById(`val-${id}`);
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                badge.innerText = `${val}${unit}`;
                callback(val);
            });
        }

        function updateBulbState() {
            if (isBulbOn) {
                bulbPointLight.intensity = savedBulbIntensity;
                bulbHaloSprite.visible = true;
                if (bulbFilamentMesh) bulbFilamentMesh.material.emissiveIntensity = 1.5;
            } else {
                bulbPointLight.intensity = 0;
                bulbHaloSprite.visible = false;
                if (bulbFilamentMesh) bulbFilamentMesh.material.emissiveIntensity = 0.0;
            }
        }

        // ---------------------------------------------------------------------
        // CONTRÔLEUR D'ORBITE MAISON
        // ---------------------------------------------------------------------
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = { alpha: 0.6, beta: 0.45 };
        let cameraDistance = 270;
        const targetCenter = new THREE.Vector3(0, 0, 0);

        function updateCameraPosition() {
            cameraAngle.beta = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraAngle.beta));
            cameraDistance = Math.max(50, Math.min(1000, cameraDistance));

            camera.position.x = targetCenter.x + cameraDistance * Math.cos(cameraAngle.beta) * Math.sin(cameraAngle.alpha);
            camera.position.y = targetCenter.y + cameraDistance * Math.sin(cameraAngle.beta);
            camera.position.z = targetCenter.z + cameraDistance * Math.cos(cameraAngle.beta) * Math.cos(cameraAngle.alpha);

            camera.lookAt(targetCenter);
        }

        function setupOrbitControls() {
            const domElement = renderer.domElement;

            const onPointerDown = (x, y) => {
                isDragging = true;
                previousMousePosition = { x, y };
            };

            const onPointerMove = (x, y) => {
                if (!isDragging) return;
                const deltaX = x - previousMousePosition.x;
                const deltaY = y - previousMousePosition.y;

                cameraAngle.alpha -= deltaX * 0.008;
                cameraAngle.beta += deltaY * 0.008;

                previousMousePosition = { x, y };
                updateCameraPosition();
            };

            const onPointerUp = () => { isDragging = false; };

            domElement.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);

            domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchend', onPointerUp);

            domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                cameraDistance += e.deltaY * 0.5;
                document.getElementById('cam-dist').value = cameraDistance.toFixed(0);
                document.getElementById('val-cam-dist').innerText = cameraDistance.toFixed(0);
                updateCameraPosition();
            }, { passive: false });

            updateCameraPosition();
        }

        // ---------------------------------------------------------------------
        // COMPTAGE DES POLYGONES
        // ---------------------------------------------------------------------
        function compterPolygones() {
            let grandTotal = 0;
            const stats = {};

            scene.traverse((object) => {
                if (object.isMesh && object.geometry) {
                    const geo = object.geometry;
                    let faces = 0;
                    if (geo.index) {
                        faces = geo.index.count / 3;
                    } else if (geo.attributes.position) {
                        faces = geo.attributes.position.count / 3;
                    }

                    let parent = object;
                    let name = "Autre/Décor";
                    while (parent) {
                        if (parent.name && parent.name !== "" && parent.name !== "ombreContact") {
                            name = parent.name;
                            break;
                        }
                        parent = parent.parent;
                    }

                    if (!stats[name]) stats[name] = 0;
                    stats[name] += faces;
                    grandTotal += faces;
                }
            });

            let html = `<div><strong>Total Scène</strong><strong>~${Math.round(grandTotal)} faces</strong></div>`;
            for (const [nom, faces] of Object.entries(stats)) {
                html += `<div><span>${nom}</span><span>${Math.round(faces)} faces</span></div>`;
            }

            document.getElementById('poly-breakdown').innerHTML = html;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isDragging) {
                cameraAngle.alpha += 0.0015;
                updateCameraPosition();
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
